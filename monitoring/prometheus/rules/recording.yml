# Host recording rules for the current node exporter scrape targets.
groups:
- name: node
  rules:
  - record: host:node_cpu_utilisation:rate5m
    expr: 1 - avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
  - record: host:node_memory_utilisation:ratio
    expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
  - record: host:node_filesystem_utilisation:ratio
    expr: "1 - (\n  node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\"\
      }\n  / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\"}\n)\n"
